trigger:
  branches:
    include:
      - main
      - master
pr:
  branches:
    include:
      - main
      - master
pool:
  vmImage: ubuntu-24.04
steps:
  - task: UseNode@1
    inputs:
      version: '22.x'
    displayName: Use Node.js 22
  - script: npm ci --no-audit --no-fund
    displayName: Install locked dependencies
  - script: npm run check
    displayName: Check JavaScript syntax
  - script: npm run test:ci
    displayName: Run HTTP, data and Azure-adapter tests
  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: reports/junit.xml
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true
    displayName: Publish test evidence
  - script: npm run build
    displayName: Build static frontend
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: dist
      artifact: stayatlas-frontend
    displayName: Publish deployable website
# A successful YAML build must be run in the student's Azure DevOps project.
# Merely including this file does not prove GitHub / Pipelines integration.
